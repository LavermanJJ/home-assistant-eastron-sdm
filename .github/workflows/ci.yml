name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Two of these checks cannot pass yet, for reasons outside the code:
      #  - hacsjson and integration_manifest read raw file content from
      #    GitHub, which is not visible while this repository is private.
      #    They clear on their own once it is public.
      #  - brands needs the integration listed in home-assistant/brands, or
      #    brand assets at custom_components/eastron_sdm/brand/icon.png.
      # Drop continue-on-error, and the ignore, when those are settled.
      - uses: hacs/action@main
        continue-on-error: true
        with:
          category: integration
          ignore: brands

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy custom_components/eastron_sdm

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: pytest tests --cov=custom_components/eastron_sdm --cov-report=term-missing
