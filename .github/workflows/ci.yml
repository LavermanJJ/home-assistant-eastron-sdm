name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Advisory only while this repository is private: the hacsjson and
      # integration_manifest checks read raw file content from GitHub, which
      # is not visible on a private repository, so they fail on content they
      # cannot fetch rather than on anything wrong. Drop continue-on-error
      # once the repository is public.
      - uses: hacs/action@main
        continue-on-error: true
        with:
          category: integration

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy custom_components/eastron_sdm

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: pytest tests --cov=custom_components/eastron_sdm --cov-report=term-missing
